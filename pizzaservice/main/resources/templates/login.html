<!DOCTYPE html>

<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta http-equiv="content-type" content="text/html; charset=UTF-8"/>
    <link th:href="@{/webjars/Semantic-UI/semantic.min.css}" rel="stylesheet"
          href="http://cdn.jsdelivr.net/semantic-ui/2.2.10/semantic.min.css" type="text/css"/>
    <link th:href="@{/resources/css/style.css}" rel="stylesheet"
          href="../static/resources/css/style.css" type="text/css"/>

    <title th:text="#{login.title}">Anmeldung</title>
</head>
<body>
<div class="ui container">
    <header>
        <div class="outline">
            <h1 th:text="#{login.title}">Anmeldung</h1>
        </div>
    </header>
    <nav th:include="navigation :: navigation"></nav>

    <form class="ui form" role="form" th:action="@{/login}" method="post">
        <div class="field">
            <label th:text="#{login.user}" for="username">Benutzername</label>
            <input type="text" id="username" name="username" autofocus="autofocus" maxlength="30"/> <br/>
        </div>
        <div class="field">
            <label th:text="#{login.password}" for="password">Passwort</label>
            <input type="password" id="password" name="password" maxlength="30"/> <br/>
        </div>
        <button type="submit" th:text="#{login.login}" class="ui button">Anmelden</button>
    </form>
</div>
</body>
</html>

<!DOCTYPE html>

<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta http-equiv="content-type" content="text/html; charset=UTF-8"/>

    <link th:href="@{/webjars/Semantic-UI/semantic.min.css}" rel="stylesheet"
          href="http://cdn.jsdelivr.net/semantic-ui/2.2.10/semantic.min.css" type="text/css"/>
    <link th:href="@{/resources/css/style.css}" rel="stylesheet"
          href="../static/resources/css/style.css" type="text/css"/>

    <title th:text="#{home.title}">Papa Pizza</title>
</head>
<body>
<div class="center aligned ui container">
    <header>
        <div class="outline">
            <h1 th:text="#{home.title}">Papa Pizza</h1>
        </div>
    </header>
    <nav th:include="navigation :: navigation"></nav>

    <h2 th:text="#{home.welcome_message}">Willkommen bei Papa Pizza</h2>
    <p sec:authorize="isAuthenticated()" th:text="#{home.welcome} + ${#authentication?.name} + '!'">Hallo Nutzer!</p>
</div>
</body>
</html>

<!DOCTYPE html>

<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta http-equiv="content-type" content="text/html; charset=UTF-8"/>

    <link th:href="@{/webjars/Semantic-UI/semantic.min.css}" rel="stylesheet"
          href="http://cdn.jsdelivr.net/semantic-ui/2.2.10/semantic.min.css" type="text/css"/>
    <link th:href="@{/resources/css/style.css}" rel="stylesheet"
          href="../static/resources/css/style.css" type="text/css"/>

    <title th:text="#{order.title}">Bestellungen</title>
</head>
<body>
<div class="center aligned ui container">
    <header>
        <div class="outline">
            <h1 th:text="#{order.title}">Bestellungen</h1>
        </div>
    </header>
    <nav th:include="navigation :: navigation"></nav>

    <div class="ui two column stackable center aligned page grid">
        <div class="row">
        <div class="two column wide ui vertical menu">
            <div class="item">
                <h3 th:text="#{order.nextBakingTime} + ${nextBakingTime}"></h3>
            </div>
        </div>
        </div>
        </br>
        <div class="row">
        <div class="two column wide ui vertical menu">
            <a class="item" th:href="@{order/new}" th:text="#{nav.order.add}">
                Bestellung aufgeben
            </a>
            <a class="item" th:href="@{order/view/inPreparation}" th:text="#{nav.order.prepare}">
                Pizzas zubereiten
            </a>
            <a class="item" th:href="@{order/view/done}" th:text="#{nav.order.deliver}">
                Bestellungen ausliefern
            </a>
            <a class="item" th:href="@{order/view/inDelivery}" th:text="#{nav.order.complete}">
                Zustellungen bestätigen
            </a>
            <a class="item" th:href="@{order/view/pickUp}" th:text="#{nav.order.willCollect}">
                Abholungen bestätigen
            </a>
        </div>
        </div>
        </br>
        <h4 th:if="${orders.isEmpty()}" th:text="#{order.noOrder}">
            Es sind keine aktiven Bestellungen im System vorhanden.
        </h4>
    </div>

    </br>

    <table class="center aligned ui celled table" th:if="${!orders.isEmpty()}">
        <thead>
        <tr>
            <th colspan="7">
                <h2 th:text="#{order.active}">Aktive Bestellungen</h2>
            </th>
        </tr>
        <tr>
            <th th:text="#{order.customer}">Kunde</th>
            <th th:text="#{order.willCollect}">Selbstabholung</th>
            <th th:text="#{order.deliveryAddress}">Lieferadresse</th>
            <th th:text="#{order.date}">Datum</th>
            <th th:text="#{order.product}">Produkte</th>
            <th th:text="#{order.totalPrice}">Gesamtpreis</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="order : ${orders} ">
            <td th:text="${order.customerName}"></td>
            <td th:if="${order.isPickUp()}" text="Ja">Ja</td>
            <td th:if="${!order.isPickUp()}" text="Nein">Nein</td>
            <td th:text="${order.address}"></td>
            <td th:text="${order.dateCreated.format(timeFormatter)}"></td>
            <td th:text="${order.orderString}" style="white-space:pre-wrap; word-wrap:break-word"></td>
            <td th:text="${order.total.number} + ' €'"></td>
        </tr>
        </tbody>
    </table>
</div>
</body>
</html>

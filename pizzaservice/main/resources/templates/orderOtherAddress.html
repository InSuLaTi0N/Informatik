<!DOCTYPE html>

<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta http-equiv="content-type" content="text/html; charset=UTF-8"/>

    <link th:href="@{/webjars/Semantic-UI/semantic.min.css}" rel="stylesheet"
          href="http://cdn.jsdelivr.net/semantic-ui/2.2.10/semantic.min.css" type="text/css"/>
    <link th:href="@{/resources/css/style.css}" rel="stylesheet"
          href="../static/resources/css/style.css" type="text/css"/>

    <title th:text="#{order.deliveryAddress}">Lieferadresse</title>
</head>
<body>
<div class="ui container">
    <header>
        <div class="outline">
            <h1 th:text="#{order.deliveryAddress}">Lieferadresse</h1>
        </div>
    </header>
    <nav>
        <div class="ui secondary pointing menu">
            <a class="item" th:href="@{/order/new}" th:text="#{order.back}">Zurück</a>
            <div class="right menu">
                <a class="item" th:href="@{/order}" th:text="#{nav.order}">Bestellungen</a>
            </div>
        </div>
    </nav>

    <br/>

    <form class="ui form" th:action="@{/order/new/items}" th:object="${otherAddressForm}" method="post">
        <div class="field">
            <label th:text="#{employee.street}">street</label>
            <input type="text" th:field="*{street}" th:errorclass="fieldError" required="required" maxlength="40"/><br/>
            <div class="ui negative message" th:if="${#fields.hasErrors('street')}" th:errors="*{street}">
                <p>Die Straße darf nicht leer sein!</p>
            </div>
        </div>
        <div class="field">
            <label th:text="#{employee.houseNumber}">Adresse</label>
            <input type="number" th:field="*{houseNumber}" th:errorclass="fieldError" min="1" max="1000" step="1"
                   required="required"/><br/>
            <div class="ui negative message" th:if="${#fields.hasErrors('houseNumber')}" th:errors="*{houseNumber}">
                <p>Die Hausnummer darf nicht leer sein!</p>
            </div>
        </div>
        <div class="field">
            <label th:text="#{employee.plz}">Adresse</label>
            <input type="text" th:field="*{plz}" th:errorclass="fieldError" required="required"/><br/>
            <div class="ui negative message" th:if="${#fields.hasErrors('plz')}" th:errors="*{plz}">
                <p>Die Postleitzahl darf nicht leer sein!</p>
            </div>
        </div>
        <div class="field">
            <label th:text="#{employee.city}">Adresse</label>
            <input type="text" th:field="*{city}" th:errorclass="fieldError" required="required" maxlength="40"/><br/>
            <div class="ui negative message" th:if="${#fields.hasErrors('city')}" th:errors="*{city}">
                <p>Die Stadt darf nicht leer sein!</p>
            </div>
        </div>
        <input type="hidden" name="address" value="otherAddress"/>
        <input type="hidden" name="telephoneNumber" th:value="${telephoneNumber}"/>
        <input type="hidden" name="customerToken" th:value="${customerToken}"/>
        <button class="ui button" th:text="#{order.next}"></button>
    </form>
</div>
</body>
</html>

<!DOCTYPE html>

<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta http-equiv="content-type" content="text/html; charset=UTF-8"/>

    <link th:href="@{/webjars/Semantic-UI/semantic.min.css}" rel="stylesheet"
          href="http://cdn.jsdelivr.net/semantic-ui/2.2.10/semantic.min.css" type="text/css"/>
    <link th:href="@{/resources/css/style.css}" rel="stylesheet"
          href="../static/resources/css/style.css" type="text/css"/>

    <title th:text="#{oven.title}">Öfen</title>
</head>
<body>
<div class="ui container">
    <header>
        <div class="outline">
            <h1 th:text="#{oven.title}">Öfen</h1>
        </div>
    </header>
    <nav>
        <div class="ui secondary pointing menu">
            <a class="item" th:href="@{/branch}" th:text="#{order.back}">Zurück</a>
        </div>
    </nav>

    <br/>

    <form class="ui form" th:action="@{/oven/done}" method="post">
        <div class="field">
            <label th:text="#{oven.edit}">Anzahl der Öfen</label>
            <input id="amount" name="amount" type="number" th:value="${orderManager.ovenCount}" required="required" min="1"/>
        </div>
        <button class="ui button" th:text="#{oven.submit}">Aktualisieren</button>
    </form>
</div>
</body>
</html>

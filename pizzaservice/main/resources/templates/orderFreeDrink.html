<!DOCTYPE html>

<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta http-equiv="content-type" content="text/html; charset=UTF-8"/>

    <link th:href="@{/webjars/Semantic-UI/semantic.min.css}" rel="stylesheet"
          href="http://cdn.jsdelivr.net/semantic-ui/2.2.10/semantic.min.css" type="text/css"/>
    <link th:href="@{/resources/css/style.css}" rel="stylesheet"
          href="../static/resources/css/style.css" type="text/css"/>

    <title th:text="#{order.addFreeDrink}">Freigetränk hinzufügen</title>
</head>
<body>
<div class="ui container">
    <header>
        <div class="outline">
            <h1 th:text="#{order.addFreeDrink}">Freigetränk hinzufügen</h1>
        </div>
    </header>
    <nav>
        <form class="ui secondary pointing menu" th:action="@{/order/new/cancel}" method="post">
            <input type="hidden" name="orderId" th:value="${order.getId()}">
            <button class="small negative ui button" th:text="#{order.cancel}">Cancel Order</button>
        </form>
    </nav>

    <table class="center aligned ui celled table" th:if="${!order.orderString.isEmpty()}">
        <thead>
        <tr>
            <th colspan="3">
                <h2 th:text="#{order.current}">Aktuelle Bestellung</h2>
            </th>
        </tr>
        <tr>
            <th th:text="#{order.name}">Name</th>
            <th th:text="#{order.quantity}">Menge</th>
            <th th:text="#{order.price}">Preis</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="orderLine : ${order.orderLineStateMap.keySet()}">
            <td th:if="${orderLine.productName.contains('Pizza')}" th:text="${orderLine.productName.split('Status: ')[0]}"
                style="white-space:pre-wrap; word-wrap:break-word"></td>
            <td th:if="${!orderLine.productName.contains('Pizza')}" th:text="${orderLine.productName}"
                style="white-space:pre-wrap; word-wrap:break-word"></td>
            <td th:text="${orderLine.quantity}"></td>
            <td th:text="${orderLine.price.number} + ' €'"></td>
        </tr>
        <tr th:each="chargeLine : ${order.chargeLineStringMap.keySet()}">
            <td th:text="${chargeLine.description}"></td>
            <td th:text="${1}"></td>
            <td th:text="${chargeLine.price.number} + ' €'"></td>
        </tr>
        </tbody>
        <tfoot>
        <tr>
            <th colspan="2">
                <h4 th:text="#{order.totalPrice}"></h4>
            </th>
            <th colspan="1">
                <h4 th:text="${order.total.number} + ' €'"></h4>
            </th>
        </tr>
        </tfoot>
    </table>
    <table class="center aligned ui celled table">
        <thead>
        <tr>
            <th colspan="3">
                <h2 th:text="#{order.drink}">Getränke</h2>
            </th>
        </tr>
        <tr>
            <th th:text="#{order.name}">Name</th>
            <th th:text="#{order.actualPrice}">Ursprünglicher Preis</th>
            <th th:text="#{order.add}">Hinzufügen</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="drink : ${drinks}">
            <form th:action="@{/order/new/items/freeDrink/done}" method="post">
                <input type="hidden" name="productId" th:value="${drink.id}"/>
                <input type="hidden" name="orderId" th:value="${order.id}"/>
                <input type="hidden" name="telephoneNumber" th:value="${telephoneNumber}"/>
                <input type="hidden" name="newTan" th:value="${newTan}"/>
                <td th:text="${drink.name}"></td>
                <td th:text="${drink.price.number} + ' €'"></td>
                <td>
                    <button class="ui button" th:text="#{order.addFree}">Gratis hinzufügen</button>
                </td>
            </form>
        </tr>
        </tbody>
    </table>
</div>
</body>
</html>

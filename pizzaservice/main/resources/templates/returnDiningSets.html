<!DOCTYPE html>

<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta http-equiv="content-type" content="text/html; charset=UTF-8"/>

    <link th:href="@{/webjars/Semantic-UI/semantic.min.css}" rel="stylesheet"
          href="http://cdn.jsdelivr.net/semantic-ui/2.2.10/semantic.min.css" type="text/css"/>
    <link th:href="@{/resources/css/style.css}" rel="stylesheet"
          href="../static/resources/css/style.css" type="text/css"/>

    <title th:text="#{order.returnDiningSet}">Essgarnituren zurückgeben</title>
</head>
<body>
<div class="ui container">
    <header>
        <div class="outline">
            <h1 th:text="#{order.returnDiningSet}">Essgarnituren zurückgeben</h1>
        </div>
    </header>
    <nav>
        <div class="ui secondary pointing menu">
            <a class="item" th:href="@{/customer}" th:text="#{order.back}">Zurück</a>
        </div>
    </nav>

    <br/>

    <h2 class="ui dividing header" th:text="#{customer.return.message} + ' ' + ${customer.getUserAccount().firstname} + ' ' + ${customer.getUserAccount().lastname}">firstname lastname</h2>

    <form class="ui form" th:action="@{/customer/return/done/{customer}(customer=${customer.getId()})}" method="post" th:if="${amount} > 0">
        <div class="field">
            <label th:text="#{customer.return.amount} + ${amount} + '):'">maximale Anzahl der rückgebbaren Essgarnituren</label>
            <input id="amount" name="amount" type="number" th:value="1" required="required" min="1" th:max="${amount}"/>
        </div>
        <button class="ui button" th:text="#{customer.return.submit}">Zurückgeben</button>
    </form>
    <div th:unless="${amount} > 0">
        <p th:text="#{customer.return.noSets}"></p>
    </div>


</div>
</body>
</html>

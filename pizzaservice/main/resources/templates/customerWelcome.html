<!DOCTYPE html>

<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta http-equiv="content-type" content="text/html; charset=UTF-8"/>

    <link th:href="@{/webjars/Semantic-UI/semantic.min.css}" rel="stylesheet"
          href="http://cdn.jsdelivr.net/semantic-ui/2.2.10/semantic.min.css" type="text/css"/>
    <link th:href="@{/resources/css/style.css}" rel="stylesheet"
          href="../static/resources/css/style.css" type="text/css"/>

    <title th:text="#{customer.welcome}">Willkommen!</title>
</head>
<body>
<div class="ui container">
    <header>
        <div class="outline">
            <h1 th:text="#{customer.welcome}">Willkommen!</h1>
        </div>
    </header>
    <nav>
        <div class="ui secondary pointing menu">
            <a class="item" th:href="@{/}" th:text="#{nav.home}">Home</a>
        </div>
    </nav>

    <br/>

    <h2 th:text="#{customer.welcome}">Willkommen!</h2>
    <h4 th:text="#{customer.TAN} + ${tan}">TAN</h4>
    <p th:text="#{customer.message}"></p>
</div>
</body>
</html>

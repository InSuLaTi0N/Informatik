<!DOCTYPE html>

<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta http-equiv="content-type" content="text/html; charset=UTF-8"/>

    <link th:href="@{/webjars/Semantic-UI/semantic.min.css}" rel="stylesheet"
          href="http://cdn.jsdelivr.net/semantic-ui/2.2.10/semantic.min.css" type="text/css"/>
    <link th:href="@{/resources/css/style.css}" rel="stylesheet"
          href="../static/resources/css/style.css" type="text/css"/>

    <title th:text="#{order.bill}">Rechnung</title>
</head>
<body>
<div class="center aligned ui container">
    <header>
        <div class="outline">
            <h1 th:text="#{order.bill}">Rechnung</h1>
        </div>
    </header>
    <nav th:include="navigation :: navigation"></nav>

    <h2 th:text="#{order.deliveryTime} + ${deliveryTime}"></h2>
    <h2 th:text="#{order.newTan} + ${newTan}"></h2>

    <br/>

    <h3 th:text="#{order.date}">Datum</h3>
    <div th:text="${date}"></div>

    <br/>

    <h3 th:text="#{order.time}">Uhrzeit</h3>
    <div th:text="${time}"></div>

    <br/>

    <h3 th:text="#{order.billingAddress}">Rechnungsadresse</h3>
    <div th:text="${order.customerName}"></div>
    <div th:text="${customer.address}"></div>

    <br/>

    <h3 th:text="#{order.deliveryAddress}">Lieferadresse</h3>
    <div th:text="${order.customerName}"></div>
    <div th:text="${order.address}"></div>

    <br/>

    <table class="center aligned ui celled table" th:if="${!order.orderString.isEmpty()}">
        <thead>
        <tr>
            <th colspan="3">
                <h2 th:text="#{order.bill}">Rechnung</h2>
            </th>
        </tr>
        <tr>
            <th th:text="#{order.name}">Name</th>
            <th th:text="#{order.quantity}">Menge</th>
            <th th:text="#{order.price}">Preis</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="orderLine : ${order.orderLineStateMap.keySet()}">
            <td th:if="${orderLine.productName.contains('Pizza')}" th:text="${orderLine.productName.split('Status: ')[0]}" style="white-space:pre-wrap; word-wrap:break-word"></td>
            <td th:if="${!orderLine.productName.contains('Pizza')}" th:text="${orderLine.productName}" style="white-space:pre-wrap; word-wrap:break-word"></td>
            <td th:text="${orderLine.quantity}"></td>
            <td th:text="${orderLine.price.number} + ' €'"></td>
        </tr>
        <tr th:each="chargeLine : ${order.chargeLineStringMap.keySet()}">
            <td th:text="${chargeLine.description}"></td>
            <td th:text="${1}"></td>
            <td th:text="${chargeLine.price.number} + ' €'"></td>
        </tr>
        </tbody>
        <tfoot>
        <tr>
            <th colspan="2" th:text="#{order.totalPrice}"></th>
            <th colspan="1" th:text="${order.total.number} + ' €'"></th>
        </tr>
        </tfoot>
    </table>
</div>
</body>
</html>
